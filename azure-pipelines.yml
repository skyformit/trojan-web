trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  remoteAppPath: '/var/www/tch-supplier-registration'
  pm2ProcessName: 'tch-supplier-registration'
  sshServiceConnection: 'REPLACE_WITH_YOUR_SSH_SERVICE_CONNECTION'

stages:
  - stage: Build
    displayName: Build web app and server
    jobs:
      - job: BuildJob
        displayName: Build
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: Install dependencies

          - script: npm run build
            displayName: Build client and server bundle

          - script: |
              set -e
              mkdir -p "$(Build.ArtifactStagingDirectory)/app"
              cp package.json package-lock.json "$(Build.ArtifactStagingDirectory)/app/"
              cp -R dist "$(Build.ArtifactStagingDirectory)/app/"
            displayName: Stage runtime files

          - publish: $(Build.ArtifactStagingDirectory)/app
            artifact: app
            displayName: Publish artifact

  - stage: Deploy
    displayName: Deploy to Azure VM
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployToVm
        displayName: Deploy
        steps:
          - download: current
            artifact: app
            displayName: Download artifact

          - task: SSH@0
            displayName: Clean previous app bundle
            inputs:
              sshEndpoint: $(sshServiceConnection)
              runOptions: commands
              commands: |
                set -e
                mkdir -p "$(remoteAppPath)"
                cd "$(remoteAppPath)"
                rm -rf dist package.json package-lock.json

          - task: CopyFilesOverSSH@0
            displayName: Copy build output to VM
            inputs:
              sshEndpoint: $(sshServiceConnection)
              sourceFolder: $(Pipeline.Workspace)/app
              contents: |
                package.json
                package-lock.json
                dist/**
              targetFolder: $(remoteAppPath)
              cleanTargetFolder: false
              overwrite: true

          - task: SSH@0
            displayName: Install production deps and restart app
            inputs:
              sshEndpoint: $(sshServiceConnection)
              runOptions: commands
              commands: |
                set -e
                cd "$(remoteAppPath)"
                npm ci --omit=dev
                if pm2 describe "$(pm2ProcessName)" >/dev/null 2>&1; then
                  pm2 restart "$(pm2ProcessName)" --update-env
                else
                  pm2 start dist/server.cjs --name "$(pm2ProcessName)"
                fi
                pm2 save
